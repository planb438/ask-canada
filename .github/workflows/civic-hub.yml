name: Civic Hub update
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect.py
      - name: Commit if changed
        run: |
          git config user.name "Civic Hub bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "Civic Hub: daily update"
          git push
